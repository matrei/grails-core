SourceSet e2eTestSourceSet = sourceSets.create('e2eTest')

tasks.register('e2eTest', Test) {
    onlyIf {
        ![
                'onlyFunctionalTests',
                'onlyHibernate5Tests',
                'onlyMongodbTests',
                'skipTests'
        ].find {
            project.hasProperty(it)
        }
    }
    group = 'verification'
    testClassesDirs = sourceSets.e2eTest.output.classesDirs
    classpath = sourceSets.e2eTest.runtimeClasspath
    useJUnitPlatform()
    systemProperty('localMavenPath', rootProject.layout.buildDirectory.dir('local-maven').get().asFile.absolutePath)
    systemProperty('grailsGradlePluginVersion', project.version)
    systemProperty('groovyVersion', e2eGroovyVersion)
    testLogging {
        exceptionFormat = 'full'
        events('passed', 'skipped', 'failed', 'standardOut', 'standardError')
    }
    beforeTest { descriptor ->
        logger.quiet ' -- $descriptor'
    }
    dependsOn(
            'publishAllPublicationsToTestCaseMavenRepoRepository',
            ':grails-gradle-bom:publishAllPublicationsToTestCaseMavenRepoRepository'
    )
}

tasks.named('check') {
    dependsOn('e2eTest')
}

extensions.configure(GradlePluginDevelopmentExtension) {
    it.testSourceSet(e2eTestSourceSet)
}

dependencies {
    // Note: must use a groovy 3 compatible version of Spock
    add('e2eTestImplementation', "org.spockframework:spock-core:${gradleBomDependencyVersions['gradle-spock.version']}", {
        exclude group: 'org.apache.groovy'
    })
    add('e2eTestImplementation', 'commons-io:commons-io:2.18.0')
    add('e2eTestImplementation', gradleTestKit())
    add('e2eTestRuntimeOnly', 'org.junit.platform:junit-platform-launcher')
}